name: Bug
description: Report a reproducible defect
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Related Requirement ID
      placeholder: QUIZ-007

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshot, test output, browser/device.
